<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Feed — PurperZone</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/main.css"></head><body data-page="feed"><div class="app-shell"><aside class="sidebar"><a class="sidebar__brand" href="index.html"><span class="sidebar__brand-mark">P</span><span>PurperZone</span></a><nav class="sidebar__nav"><a class="sidebar__link" data-page="home" href="index.html">⌂ <span>Início</span></a><a class="sidebar__link" data-page="profile" href="profile.html">◎ <span>Perfil</span></a><a class="sidebar__link" data-page="projects" href="projects.html">⌘ <span>Projetos</span></a><a class="sidebar__link" data-page="library" href="library.html">▣ <span>Biblioteca</span></a></nav><div class="sidebar__footer"><button class="btn btn--ghost" id="logout-btn">Sair</button></div></aside><main class="content"><div class="topbar"><div><div class="eyebrow">COMUNIDADE</div><h1 class="page-title">Feed</h1></div><span class="live-indicator">ao vivo</span></div><div class="toolbar"><p class="muted">Publicações recentes da comunidade PurperZone.</p><button class="btn btn--primary" id="new-post-btn">+ Publicar</button></div><form class="card card--padded" id="new-post-form" hidden style="margin-bottom:18px"><div class="field"><label for="post-content">O que você quer compartilhar?</label><textarea id="post-content" rows="4" maxlength="5000" required></textarea></div><div class="field" style="margin-top:14px"><label for="post-image">Imagem (URL opcional)</label><input id="post-image" type="url"></div><button class="btn btn--primary" type="submit" style="margin-top:16px">Publicar</button></form><section id="feed-container" class="feed-grid"><div class="skeleton"></div><div class="skeleton"></div></section></main></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabaseClient.js"></script><script src="js/auth.js"></script><script src="js/realtime.js"></script><script src="js/feed.js"></script><script>document.getElementById('logout-btn').onclick=signOut;const c=document.getElementById('feed-container'),f=document.getElementById('new-post-form');let uid=null;async function refresh(){await loadGlobalFeed(c)}(async()=>{const u=await requireAuth();if(!u)return;uid=u.id;await refresh();watchTable({table:'posts',refresh});refreshOnReturn(refresh)})();document.getElementById('new-post-btn').onclick=()=>f.hidden=!f.hidden;f.onsubmit=async e=>{e.preventDefault();const r=await createPost(document.getElementById('post-content').value.trim(),document.getElementById('post-image').value.trim());if(r.error){alert(r.error.message||r.error);return}f.reset();f.hidden=true;refresh()};</script></body></html>
