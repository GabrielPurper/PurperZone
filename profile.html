<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Perfil — PurperZone</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/main.css"></head><body data-page="profile"><div class="app-shell"><aside class="sidebar"><a class="sidebar__brand" href="index.html"><span class="sidebar__brand-mark">P</span><span>PurperZone</span></a><nav class="sidebar__nav"><a class="sidebar__link" data-page="home" href="index.html">⌂ <span>Início</span></a><a class="sidebar__link" data-page="profile" href="profile.html">◎ <span>Perfil</span></a><a class="sidebar__link" data-page="projects" href="projects.html">⌘ <span>Projetos</span></a><a class="sidebar__link" data-page="library" href="library.html">▣ <span>Biblioteca</span></a></nav><div class="sidebar__footer"><button class="btn btn--ghost" id="logout-btn">Sair</button></div></aside><main class="content"><div class="topbar"><div><div class="eyebrow">PERFIL</div><h1 class="page-title">Espaço do usuário</h1></div><span class="live-indicator">ao vivo</span></div><header class="profile-header"><img class="profile-header__avatar" id="avatar" alt="Avatar"><div><div class="profile-header__name" id="display-name">Carregando…</div><div class="profile-header__username" id="username-label"></div><p class="profile-header__bio" id="bio">Carregando perfil...</p><div class="profile-header__stats"><span><strong data-stat="followers">0</strong> seguidores</span><span><strong data-stat="following">0</strong> seguindo</span></div></div></header><div class="tabs"><div class="tabs__item tabs__item--active">Feed</div><a class="tabs__item" href="projects.html">Projetos</a><a class="tabs__item" href="library.html">Biblioteca</a></div><section id="feed-container" class="feed-grid"><div class="skeleton"></div></section></main></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabaseClient.js"></script><script src="js/auth.js"></script><script src="js/realtime.js"></script><script src="js/profile.js"></script><script>document.getElementById('logout-btn').onclick=signOut;let pid=null;const feed=document.getElementById('feed-container');async function init(){const p=new URLSearchParams(location.search);let u=p.get('u');if(!u){const user=await requireAuth();if(!user)return;const{data}=await supabase.from('profiles').select('username').eq('id',user.id).single();u=data?.username}if(!u){feed.innerHTML='<div class="empty-state">Perfil sem username.</div>';return}const profile=await loadProfileHeader(u);if(!profile){feed.innerHTML='<div class="empty-state">Perfil não encontrado.</div>';return}pid=profile.id;await loadFeed(pid,feed);watchTable({table:'posts',filter:`author_id=eq.${pid}`,refresh:()=>loadFeed(pid,feed)});watchTable({table:'follows',refresh:()=>loadProfileHeader(u)});refreshOnReturn(()=>loadFeed(pid,feed))}init();</script></body></html>
