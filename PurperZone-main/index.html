<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PurperZone</title>

  <!-- Tipografia: Space Grotesk (display), Inter (corpo), JetBrains Mono (dados técnicos) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/main.css" />

  <style>
    /* Estilos exclusivos da landing page — não precisam ir para
       main.css porque só existem aqui. */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: var(--space-8);
      gap: var(--space-6);
    }

    .hero__title {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 6vw, 4rem);
      line-height: 1.05;
    }

    .hero__title span {
      color: var(--accent-strong);
    }

    .hero__subtitle {
      color: var(--text-muted);
      max-width: 50ch;
      font-size: var(--text-lg);
    }

    .hero__actions {
      display: flex;
      gap: var(--space-4);
    }

    .hero__actions .btn {
      padding: var(--space-3) var(--space-6);
    }
  </style>
</head>
<body>
  <main class="hero">
    <div class="hero__title">
      Seu perfil de <span>código</span>, <span>presença</span> e
      <span>jogos</span> — em um só lugar.
    </div>
    <p class="hero__subtitle">
      PurperZone junta o que você constrói, o que você compartilha e o que
      você joga em um perfil só: projetos com stack e link do repositório,
      um feed de posts e uma biblioteca com o que você está jogando agora.
    </p>
    <div class="hero__actions">
      <a class="btn btn--primary" href="login.html">Entrar</a>
      <a class="btn btn--ghost" href="profile.html">Ver um perfil de exemplo</a>
    </div>
  </main>
</body>
</html>
