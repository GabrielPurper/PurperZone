<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Biblioteca — PurperZone</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body data-page="library">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar__brand">PurperZone</div>
      <nav class="sidebar__nav">
        <a class="sidebar__link" data-page="profile" href="profile.html">Perfil</a>
        <a class="sidebar__link" data-page="projects" href="projects.html">Projetos</a>
        <a class="sidebar__link" data-page="library" href="library.html">Biblioteca</a>
      </nav>
      <button class="btn btn--ghost" id="logout-btn" style="margin-top: auto">
        Sair
      </button>
    </aside>

    <main class="content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-6)">
        <h1 style="font-family: var(--font-display); font-size: var(--text-xl)">
          Biblioteca
        </h1>
        <button class="btn btn--primary" id="new-item-btn">Adicionar item</button>
      </div>

      <!-- Formulário de criação, escondido até o clique em "Adicionar item" -->
      <form class="card" id="new-item-form" hidden style="margin-bottom: var(--space-6)">
        <div class="field">
          <label for="item-title">Título</label>
          <input type="text" id="item-title" required />
        </div>
        <div class="field" style="margin-top: var(--space-3)">
          <label for="item-platform">Plataforma</label>
          <input type="text" id="item-platform" placeholder="PC, PS5, Switch..." />
        </div>
        <div class="field" style="margin-top: var(--space-3)">
          <label for="item-status">Status</label>
          <select id="item-status">
            <option value="backlog">Na fila</option>
            <option value="playing">Jogando</option>
            <option value="completed">Concluído</option>
            <option value="dropped">Abandonado</option>
          </select>
        </div>
        <button type="submit" class="btn btn--primary" style="margin-top: var(--space-4)">
          Salvar
        </button>
      </form>

      <section id="library-container">
        <!-- Preenchido dinamicamente por library.js -> loadLibrary() -->
      </section>
    </main>
  </div>

  <!-- Ordem importa: supabase-js -> supabaseClient.js -> auth.js -> library.js -> este script -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/library.js"></script>
  <script>
    document.getElementById("logout-btn").addEventListener("click", signOut);

    const containerEl = document.getElementById("library-container");
    let currentUserId = null;

    (async function init() {
      const user = await requireAuth();
      if (!user) return;
      currentUserId = user.id;
      await loadLibrary(currentUserId, containerEl);
    })();

    const formEl = document.getElementById("new-item-form");
    document.getElementById("new-item-btn").addEventListener("click", () => {
      formEl.hidden = !formEl.hidden;
    });

    formEl.addEventListener("submit", async (event) => {
      event.preventDefault();

      const { error } = await addLibraryItem({
        title: document.getElementById("item-title").value,
        platform: document.getElementById("item-platform").value,
        status: document.getElementById("item-status").value,
      });

      if (error) {
        alert(error.message ?? error);
        return;
      }

      formEl.reset();
      formEl.hidden = true;
      await loadLibrary(currentUserId, containerEl);
    });
  </script>
</body>
</html>
