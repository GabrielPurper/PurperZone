<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Projetos — PurperZone</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/main.css"></head><body data-page="projects"><div class="app-shell"><aside class="sidebar"><a class="sidebar__brand" href="index.html"><span class="sidebar__brand-mark">P</span><span>PurperZone</span></a><nav class="sidebar__nav"><a class="sidebar__link" data-page="home" href="index.html">⌂ <span>Início</span></a><a class="sidebar__link" data-page="profile" href="profile.html">◎ <span>Perfil</span></a><a class="sidebar__link" data-page="projects" href="projects.html">⌘ <span>Projetos</span></a><a class="sidebar__link" data-page="library" href="library.html">▣ <span>Biblioteca</span></a></nav><div class="sidebar__footer"><button class="btn btn--ghost" id="logout-btn">Sair</button></div></aside><main class="content"><div class="topbar"><div><div class="eyebrow">DESENVOLVIMENTO</div><h1 class="page-title">Projetos</h1></div><span class="live-indicator">ao vivo</span></div><div class="toolbar"><p class="muted">Projetos públicos da comunidade, com dados vindos diretamente do Supabase.</p><button class="btn btn--primary" id="new-project-btn">+ Novo projeto</button></div><form class="card card--padded" id="new-project-form" hidden style="margin-bottom:18px"><div class="grid grid--2"><div class="field"><label for="project-name">Nome</label><input id="project-name" required></div><div class="field"><label for="project-repo">Repositório</label><input id="project-repo" type="url"></div></div><div class="field" style="margin-top:14px"><label for="project-description">Descrição</label><input id="project-description"></div><div class="field" style="margin-top:14px"><label for="project-stack">Tecnologias</label><input id="project-stack" placeholder="Python, C++, JavaScript"></div><button class="btn btn--primary" type="submit" style="margin-top:16px">Publicar projeto</button></form><section id="projects-container" class="grid grid--2"><div class="skeleton"></div><div class="skeleton"></div></section></main></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabaseClient.js"></script><script src="js/auth.js"></script><script src="js/realtime.js"></script><script src="js/projects.js"></script><script>document.getElementById('logout-btn').onclick=signOut;const c=document.getElementById('projects-container'),f=document.getElementById('new-project-form');let uid=null;async function refresh(){if(uid)await loadProjects(uid,c)}(async()=>{const u=await requireAuth();if(!u)return;uid=u.id;await refresh();watchTable({table:'projects',refresh});refreshOnReturn(refresh)})();document.getElementById('new-project-btn').onclick=()=>f.hidden=!f.hidden;f.onsubmit=async e=>{e.preventDefault();const stack=document.getElementById('project-stack').value.split(',').map(x=>x.trim()).filter(Boolean);const r=await createProject({name:document.getElementById('project-name').value.trim(),description:document.getElementById('project-description').value.trim(),repoUrl:document.getElementById('project-repo').value.trim(),techStack:stack});if(r.error){alert(r.error.message||r.error);return}f.reset();f.hidden=true;refresh()};</script></body></html>
