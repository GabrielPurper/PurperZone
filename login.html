<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — PurperZone</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/main.css"></head><body><main class="hero"><form class="card card--padded" id="login-form" style="width:min(100%,430px)"><a href="index.html" class="eyebrow">← voltar</a><h1 class="page-title" style="font-size:2rem;margin-top:12px">Entrar</h1><p class="muted">Acesse seu perfil no PurperZone.</p><div id="form-message" class="form-message"></div><div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label for="password">Senha</label><input id="password" type="password" required autocomplete="current-password"></div><div class="field" id="username-field" hidden><label for="username">Nome de usuário</label><input id="username" autocomplete="username"></div><button class="btn btn--primary" type="submit" id="submit-btn">Entrar</button><button class="btn btn--ghost" type="button" id="toggle-mode-btn">Não tem conta? Criar uma</button></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabaseClient.js"></script><script src="js/auth.js"></script><script>let mode="login";const f=document.getElementById("login-form"),m=document.getElementById("form-message"),uf=document.getElementById("username-field"),sb=document.getElementById("submit-btn"),tb=document.getElementById("toggle-mode-btn");function msg(t,c=""){m.textContent=t;m.className="form-message "+(c?"form-message--"+c:"")}tb.onclick=()=>{mode=mode==="login"?"signup":"login";uf.hidden=mode==="login";sb.textContent=mode==="login"?"Entrar":"Criar conta";tb.textContent=mode==="login"?"Não tem conta? Criar uma":"Já tem conta? Entrar";msg("")};f.onsubmit=async e=>{e.preventDefault();msg("Processando...");const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value,username=document.getElementById("username").value.trim(),r=mode==="login"?await signIn(email,password):await signUp(email,password,username);if(r.error){msg(r.error.message||String(r.error),"error");return}if(mode==="signup"){msg("Conta criada. Verifique seu email se necessário.","success");if(r.data?.session)location.href="profile.html";return}location.href="profile.html"};</script></body></html>
