<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · PurperZone</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="reset.css"><link rel="stylesheet" href="variables.css"><link rel="stylesheet" href="main.css"></head><body class="auth-page"><main class="auth-card card"><a class="brand" href="index.html"><span class="brand-mark">P</span>PurperZone</a><div class="auth-switch"><button data-mode="login">Entrar</button><button data-mode="signup">Criar conta</button><button data-mode="reset">Recuperar</button></div><form data-auth-form data-mode="login" class="form-grid"><input name="email" type="email" placeholder="E-mail" required><input name="username" placeholder="Username" hidden><input name="display_name" placeholder="Nome" hidden><input name="password" type="password" minlength="8" placeholder="Senha" required><button type="submit" class="btn btn--primary">Entrar</button></form><div class="oauth"><button data-oauth="google" class="btn btn--ghost">Continuar com Google</button><button data-oauth="github" class="btn btn--ghost">Continuar com GitHub</button></div><p class="muted">Google e GitHub só funcionarão quando os provedores estiverem configurados no Supabase Auth.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module">import{bindAuthForm,oauth}from'./auth.js';const f=document.querySelector('[data-auth-form]');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{const m=b.dataset.mode;f.dataset.mode=m;f.querySelector('[name=username]').hidden=m!=='signup';f.querySelector('[name=display_name]').hidden=m!=='signup';f.querySelector('[name=password]').hidden=m==='reset';f.querySelector('button[type=submit]').textContent=m==='login'?'Entrar':m==='signup'?'Criar conta':'Enviar recuperação'});document.querySelectorAll('[data-oauth]').forEach(b=>b.onclick=()=>oauth(b.dataset.oauth));bindAuthForm();</script></body></html>
