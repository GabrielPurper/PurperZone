<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Biblioteca — PurperZone</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/main.css"></head><body data-page="library"><div class="app-shell"><aside class="sidebar"><a class="sidebar__brand" href="index.html"><span class="sidebar__brand-mark">P</span><span>PurperZone</span></a><nav class="sidebar__nav"><a class="sidebar__link" data-page="home" href="index.html">⌂ <span>Início</span></a><a class="sidebar__link" data-page="profile" href="profile.html">◎ <span>Perfil</span></a><a class="sidebar__link" data-page="projects" href="projects.html">⌘ <span>Projetos</span></a><a class="sidebar__link" data-page="library" href="library.html">▣ <span>Biblioteca</span></a></nav><div class="sidebar__footer"><button class="btn btn--ghost" id="logout-btn">Sair</button></div></aside><main class="content"><div class="topbar"><div><div class="eyebrow">GAMES</div><h1 class="page-title">Biblioteca</h1></div><span class="live-indicator">ao vivo</span></div><div class="toolbar"><p class="muted">Sua biblioteca de games, organizada por status e plataforma.</p><button class="btn btn--primary" id="new-item-btn">+ Adicionar</button></div><form class="card card--padded" id="new-item-form" hidden style="margin-bottom:18px"><div class="grid grid--2"><div class="field"><label for="item-title">Título</label><input id="item-title" required></div><div class="field"><label for="item-platform">Plataforma</label><input id="item-platform" placeholder="PC, PS5, Switch..."></div></div><div class="field" style="margin-top:14px"><label for="item-cover">Capa (URL opcional)</label><input id="item-cover" type="url"></div><div class="field" style="margin-top:14px"><label for="item-status">Status</label><select id="item-status"><option value="backlog">Na fila</option><option value="playing">Jogando</option><option value="completed">Concluído</option><option value="dropped">Abandonado</option></select></div><button class="btn btn--primary" type="submit" style="margin-top:16px">Adicionar à biblioteca</button></form><section id="library-container" class="grid"><div class="skeleton"></div></section></main></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabaseClient.js"></script><script src="js/auth.js"></script><script src="js/realtime.js"></script><script src="js/library.js"></script><script>document.getElementById('logout-btn').onclick=signOut;const c=document.getElementById('library-container'),f=document.getElementById('new-item-form');let uid=null;async function refresh(){if(uid)await loadLibrary(uid,c)}(async()=>{const u=await requireAuth();if(!u)return;uid=u.id;await refresh();watchTable({table:'library_items',refresh});refreshOnReturn(refresh)})();document.getElementById('new-item-btn').onclick=()=>f.hidden=!f.hidden;f.onsubmit=async e=>{e.preventDefault();const r=await addLibraryItem({title:document.getElementById('item-title').value.trim(),platform:document.getElementById('item-platform').value.trim(),coverUrl:document.getElementById('item-cover').value.trim(),status:document.getElementById('item-status').value});if(r.error){alert(r.error.message||r.error);return}f.reset();f.hidden=true;refresh()};</script></body></html>
